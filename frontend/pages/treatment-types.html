</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark navbar-sunrise no-print">
    <div class="container-fluid">
        <a class="navbar-brand navbar-brand-custom" href="dashboard.html">Sunrise Dental Clinic</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMain">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navMain">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                <li class="nav-item"><a class="nav-link" href="dashboard.html">Dashboard</a></li>
                <li class="nav-item"><a class="nav-link" href="appointments.html">Appointments</a></li>
                <li class="nav-item"><a class="nav-link" href="dentists.html">Dentists</a></li>
                <li class="nav-item"><a class="nav-link" href="treatment-types.html">Treatment Types</a></li>
                <li class="nav-item"><a class="nav-link" href="patients.html">Patients</a></li>
                <li class="nav-item"><a class="nav-link" href="reports.html">Reports</a></li>
                <li class="nav-item" data-role-admin-only><a class="nav-link" href="users.html">Staff Accounts</a></li>
                <li class="nav-item"><a class="nav-link" href="help.html">Help</a></li>
            </ul>
            <ul class="navbar-nav align-items-lg-center">
                <li class="nav-item text-white-50 small me-lg-3"><span id="navUserName"></span> (<span id="navUserRole"></span>)</li>
                <li class="nav-item"><a class="btn btn-outline-light btn-sm" href="#" id="logoutBtn">Logout</a></li>
            </ul>
        </div>
    </div>
</nav>

<main class="container-fluid px-4 py-4">
    <h1 class="h4 section-title mb-3">Treatment Types</h1>
    <div id="alertBox"></div>

    <div class="row g-3">
        <div class="col-lg-7">
            <div class="card p-3">
                <h2 class="h6 section-title">All Treatment Types</h2>
                <div class="table-responsive">
                    <table class="table align-middle">
                        <thead><tr><th>Name</th><th>Consultation Fee</th><th>Description</th><th></th></tr></thead>
                        <tbody id="treatmentTypesBody"><tr><td colspan="4" class="text-muted">Loading...</td></tr></tbody>
                    </table>
                </div>
            </div>
        </div>

        <div class="col-lg-5">
            <div class="card p-3">
                <h2 class="h6 section-title">Add Treatment Type</h2>
                <div id="typeFormAlert"></div>
                <form id="treatmentTypeForm">
                    <div class="mb-2">
                        <label class="form-label">Treatment Name</label>
                        <input type="text" class="form-control" id="treatmentName" placeholder="e.g. Root Canal" required>
                        <div class="field-error" id="err-treatmentName"></div>
                    </div>
                    <div class="mb-2">
                        <label class="form-label">Consultation Fee (Rs.)</label>
                        <input type="number" class="form-control" id="consultationFee" step="0.01" min="0.01" required>
                        <div class="field-error" id="err-consultationFee"></div>
                    </div>
                    <div class="mb-2">
                        <label class="form-label">Description (optional)</label>
                        <input type="text" class="form-control" id="description">
                    </div>
                    <button type="submit" class="btn btn-brand w-100">Add Treatment Type</button>
                </form>
            </div>
        </div>
    </div>
</main>

<script src="../assets/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
<script src="../assets/js/api.js"></script>
<script src="../assets/js/auth.js"></script>
<script src="../assets/js/treatment-types.js"></script>
</body>
</html>
